# Add under your Development section in config/services.yaml
    - Code Indexer:
        id: tgrep-manager
        icon: mdi-lightning-bolt
        href: http://<YOUR_SERVER_IP>:3150
        description: Trigram Index & Search Manager
        target: _blank
        siteMonitor: http://<YOUR_SERVER_IP>:3150
        widget:
          type: customapi
          url: http://<YOUR_SERVER_IP>:3150/api/widget
          refreshInterval: 5000
          mappings:
            - field: running
              label: Active
            - field: indexed
              label: Indexed
            - field: total
              label: Repos
