services:
  tgrep-manager:
    build: .
    container_name: tgrep-manager
    restart: unless-stopped
    ports:
      - "3150:3150"
    # Note: On Linux, you can use network_mode: "host" so host AI agents can reach dynamic daemon ports
    # network_mode: "host"
    volumes:
      # Mount your workspace directory containing repositories
      - ${WORKSPACE_DIR:-./sample-projects}:/source-code
    environment:
      - PORT=3150
      - SOURCE_DIR=/source-code
